spring.application.name=ngoctamhotel
spring.config.import=optional:file:.env
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:NgocTamHotel};encrypt=true;trustServerCertificate=${DB_TRUST_CERTIFICATE:true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

app.auth.jwt-secret=${JWT_SECRET:change-this-development-secret-before-production-32-characters}
app.auth.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.auth.registration-enabled=${REGISTRATION_ENABLED:true}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
