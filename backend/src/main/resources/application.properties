spring.application.name=ngoctamhotel
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ngoc_tam_hotel}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

app.auth.jwt-secret=${JWT_SECRET:change-this-development-secret-before-production-32-characters}
app.auth.jwt-expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.auth.registration-enabled=${REGISTRATION_ENABLED:true}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
